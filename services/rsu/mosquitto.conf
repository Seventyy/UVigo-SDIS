# Mosquitto 2.x listens only on localhost and rejects anonymous clients unless told otherwise.
listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest stdout
# Defaults (20 in flight / 1000 queued per client) silently DROP messages when a burst arrives
# (e.g. the "burst" experiment). Raise them so the RSU never loses messages inside the broker.
max_inflight_messages 200
max_queued_messages 100000
